[project]
name = "jmbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "colorama>=0.4.6",
    "fastapi>=0.118.0",
    "img2pdf>=0.6.3",
    "jmcomic>=2.7.7",
    "pillow>=12.3.0",
    "platformdirs>=4.11.11",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.37.0",
    "websocket-client>=1.9.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pylint>=4.0.8",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
